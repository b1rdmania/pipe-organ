<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Voicer · York Cathedral</title>
<style>
  :root { --ink: #e9e7e1; --dim: #6d6b66; --neon: #ff3d6e; --line: #2a2a30; --m: clamp(16px, 3vw, 24px); --l: max(var(--m), env(safe-area-inset-left)); --r: max(var(--m), env(safe-area-inset-right)); --b: max(var(--m), env(safe-area-inset-bottom)); --t: max(var(--m), env(safe-area-inset-top)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background-color: #000000; }
  /* A full-screen canvas app: the page itself never scrolls. */
  body { height: 100dvh; background: #000; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { font: 15px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
  .fade { transition: opacity 1s ease-out; }
  .gone { opacity: 0; pointer-events: none; }

  #intro { position: fixed; inset-inline-start: var(--l); inset-block-end: var(--b); margin-inline-end: var(--r); max-width: 30em; display: flex; flex-direction: column; gap: 18px; }
  #intro h1 { font-weight: 300; font-size: clamp(40px, 7vw, 72px); line-height: 1; letter-spacing: -0.03em; }
  #intro h1 span { display: block; margin-top: 10px; font-size: 0.3em; letter-spacing: 0; color: var(--dim); }
  #intro p { color: #a9a7a1; }
  #rooms { display: flex; gap: 22px; }
  #rooms a { min-block-size: 44px; min-inline-size: 44px; display: inline-flex; align-items: center; color: var(--dim); text-decoration: none; border-block-end: 1px solid transparent; }
  #rooms a[aria-current="page"] { color: var(--ink); border-block-end-color: var(--neon); }
  @media (hover: hover) and (pointer: fine) { #rooms a:hover { color: var(--ink); } }
  #rooms a:active { color: var(--neon); }
  #begin { all: unset; cursor: pointer; align-self: flex-start; min-block-size: 44px; padding-inline: 30px; display: inline-flex; align-items: center; border: 1px solid var(--ink); }
  @media (hover: hover) and (pointer: fine) { #begin:hover { color: var(--neon); border-color: var(--neon); } }
  #begin:active { color: var(--neon); border-color: var(--neon); }

  #card { position: fixed; inset-inline-start: var(--l); inset-block-end: var(--b); max-inline-size: min(34em, calc(100vw - var(--l) - var(--r))); pointer-events: none; }
  #card small { display: block; margin-bottom: 8px; color: var(--neon); }
  #card h2 { font-weight: 300; font-size: clamp(26px, 4vw, 38px); line-height: 1.05; letter-spacing: -0.02em; }
  #card p { margin-top: 8px; color: #a9a7a1; font-size: clamp(15px, 1.7vw, 17px); }

  #steps { position: fixed; left: 52vw; top: 50%; transform: translateY(-50%); pointer-events: none; }
  #steps ol { display: flex; flex-direction: column; gap: 10px; border: 0; }
  #steps li { border: 0; color: #3e3d3a; transition: color 0.3s; }
  #steps li.on { color: var(--neon); }
  #steps li.done { color: var(--ink); }
  #steps p { margin-top: 18px; max-width: 18em; min-height: 3em; color: #a9a7a1; transition: opacity 0.2s; }

  #count { position: fixed; inset-inline-end: var(--r); inset-block-start: calc(var(--t) + 56px); color: var(--dim); }
  /* Top right, clear of the cards and lists at the bottom and left. */
  .ctl { all: unset; position: fixed; inset-inline-end: var(--r); inset-block-start: var(--t); cursor: pointer; min-block-size: 44px; min-inline-size: 44px; padding-inline: 18px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3e3d3a; color: #a9a7a1; transition: opacity 1s ease-out; }
  @media (hover: hover) and (pointer: fine) { .ctl:hover { color: var(--neon); border-color: var(--neon); } }
  .ctl:active { color: var(--neon); border-color: var(--neon); }
  .ctl.gone { opacity: 0; pointer-events: none; }
  #progress { position: fixed; left: 0; bottom: 0; height: 1px; width: 0; background: var(--neon); }

  .ui { position: fixed; inset-inline-start: var(--l); inset-block-start: var(--t); inline-size: min(340px, calc(100vw - var(--l) - var(--r))); max-block-size: calc(100dvh - var(--t) - var(--b) - 56px); overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; }
  ol { list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li button { all: unset; display: flex; justify-content: space-between; align-items: center; gap: 12px; inline-size: 100%; min-block-size: 44px; cursor: pointer; color: #a9a7a1; }
  li button span { color: var(--dim); text-align: right; }
  @media (hover: hover) and (pointer: fine) { li button:hover { color: var(--ink); } }
  li button:active { color: var(--ink); }
  li button[aria-pressed="true"] { color: var(--neon); }
  #find input { all: unset; display: block; inline-size: 100%; min-block-size: 44px; font-size: 16px; border-block-end: 1px solid var(--line); color: var(--ink); }
  #find input::placeholder { color: var(--dim); }
  #results:empty { display: none; }
  :where(button, input):focus-visible { outline: 1px solid var(--neon); outline-offset: 3px; }
  #progress { inset-block-end: 0; }
  @media (max-width: 720px) { #steps { left: auto; inset-inline-end: var(--r); top: 38%; } #steps p { max-inline-size: 13em; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<section id="intro" class="fade">
  <h1>The Voicer<span id="roomname">York Cathedral</span></h1>
  <p>No recordings. Every pipe is built and tuned in front of you. Best with headphones.</p>
  <button id="begin">Begin</button>
</section>
<div id="card" class="fade gone" aria-live="polite"><small class="num"></small><h2></h2><p></p></div>
<div id="steps" class="fade gone"><ol class="num"><li data-k="cut">Cut-up</li><li data-k="length">Length</li><li data-k="toe">Toe</li><li data-k="nick">Nicks</li></ol><p></p></div>
<div id="count" class="num fade gone"></div>
<div id="progress"></div>
<button id="skip" class="ctl fade gone">Skip</button>
<button id="stopbtn" class="ctl fade gone">Stop</button>
<section class="ui fade gone" id="ui">
  <ol id="songs"></ol>
  <form id="find"><input id="q" type="search" placeholder="Search a song" autocomplete="off" aria-label="Search a song"></form>
  <ol id="results"></ol>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
