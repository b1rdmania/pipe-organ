<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Robot Organ · York Cathedral</title>
<style>
  :root { --ink: #e9e7e1; --dim: #6d6b66; --neon: #ff3d6e; --line: #2a2a30; --m: clamp(16px, 3vw, 24px); --l: max(var(--m), env(safe-area-inset-left)); --r: max(var(--m), env(safe-area-inset-right)); --b: max(var(--m), env(safe-area-inset-bottom)); --t: max(var(--m), env(safe-area-inset-top)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Every control has its own :active colour, so drop iOS's grey tap flash. */
  :where(button, a) { -webkit-tap-highlight-color: transparent; }
  html { background-color: #000000; }
  /* A full-screen canvas app: the page itself never scrolls. */
  body { height: 100dvh; background: #000; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { font: 15px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0.08em; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
  .fade { transition: opacity 1s ease-out; }
  .gone { opacity: 0; pointer-events: none; }

  #intro { position: fixed; inset-inline-start: var(--l); inset-block-end: var(--b); margin-inline-end: var(--r); max-width: 30em; display: flex; flex-direction: column; gap: 18px; }
  #intro h1 { font-weight: 300; font-size: clamp(40px, 7vw, 72px); line-height: 1; letter-spacing: -0.03em; }
  #intro h1 span { display: block; margin-top: 12px; font-size: max(17px, 0.3em); line-height: 1.3; letter-spacing: 0; color: var(--ink); }
  #intro .go { display: flex; align-items: center; gap: 24px; }
  #intro .go a { display: inline-flex; align-items: center; min-block-size: 44px; color: #a9a7a1; text-underline-offset: 4px; text-decoration-color: var(--neon); }
  #intro .go a:active { color: var(--neon); }
  @media (hover: hover) and (pointer: fine) { #intro .go a:hover { color: var(--ink); } }
  #intro p { color: #a9a7a1; }
  #rooms { display: flex; gap: 22px; }
  #rooms a { min-block-size: 44px; min-inline-size: 44px; display: inline-flex; align-items: center; color: var(--dim); text-decoration: none; border-block-end: 1px solid transparent; }
  #rooms a[aria-current="page"] { color: var(--ink); border-block-end-color: var(--neon); }
  @media (hover: hover) and (pointer: fine) { #rooms a:hover { color: var(--ink); } }
  #rooms a:active { color: var(--neon); }
  #begin { all: unset; cursor: pointer; align-self: flex-start; min-block-size: 44px; padding-inline: 30px; display: inline-flex; align-items: center; border: 1px solid var(--ink); }
  @media (hover: hover) and (pointer: fine) { #begin:hover { color: var(--neon); border-color: var(--neon); } }
  #begin:active { color: var(--neon); border-color: var(--neon); }

  #card { position: fixed; inset-inline-start: var(--l); inset-block-end: var(--b); max-inline-size: min(34em, calc(100vw - var(--l) - var(--r))); pointer-events: none; }
  #card small { display: block; margin-bottom: 8px; color: var(--neon); }
  #card h2 { font-weight: 300; font-size: clamp(26px, 4vw, 38px); line-height: 1.05; letter-spacing: -0.02em; }
  #card p { margin-top: 8px; color: #a9a7a1; font-size: clamp(15px, 1.7vw, 17px); }

  #steps { position: fixed; inset-inline-start: 52vw; inset-block-start: 50%; translate: 0 -50%; pointer-events: none; }
  #steps p { max-width: 18em; min-height: 3em; color: #a9a7a1; transition: opacity 0.2s; }

  /* Top right, clear of the cards and lists at the bottom and left. */
  .ctl { all: unset; position: fixed; inset-inline-end: var(--r); inset-block-start: var(--t); cursor: pointer; min-block-size: 44px; min-inline-size: 44px; padding-inline: 18px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3e3d3a; color: #a9a7a1; transition: opacity 1s ease-out; }
  @media (hover: hover) and (pointer: fine) { .ctl:hover { color: var(--neon); border-color: var(--neon); } }
  .ctl:active { color: var(--neon); border-color: var(--neon); }
  .ctl.gone { opacity: 0; pointer-events: none; }
  #progress { position: fixed; inset-inline-start: 0; inset-block-end: 0; block-size: 1px; inline-size: 0; background: var(--neon); }

  .ui { position: fixed; inset-inline-start: var(--l); inset-block-start: var(--t); inline-size: min(360px, calc(100vw - var(--l) - var(--r))); max-block-size: calc(100dvh - var(--t) - var(--b) - 56px); overflow: auto; overscroll-behavior: contain; padding: 16px 18px 18px; background: rgba(0, 0, 0, 0.82); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 16px; }
  ol { list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li button { all: unset; display: flex; justify-content: space-between; align-items: center; gap: 12px; inline-size: 100%; min-block-size: 44px; cursor: pointer; color: #a9a7a1; }
  li button span { color: var(--dim); text-align: end; }
  @media (hover: hover) and (pointer: fine) { li button:hover { color: var(--ink); } }
  li button:active { color: var(--ink); }
  li button[aria-pressed="true"] { color: var(--neon); }
  #find input { all: unset; display: block; inline-size: 100%; min-block-size: 44px; font-size: 16px; border-block-end: 1px solid var(--line); color: var(--ink); }
  #find input::placeholder { color: var(--dim); }
  #results:empty { display: none; }
  .ui .label { color: var(--dim); margin-block-end: -8px; }
  .ui .primary { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: center; min-block-size: 48px; border: 1px solid var(--neon); color: var(--ink); }
  .ui .primary:active { background: var(--neon); color: #000; }
  .ui .plain { all: unset; cursor: pointer; display: flex; align-items: center; min-block-size: 44px; color: #a9a7a1; border-block-end: 1px solid var(--line); margin-block-start: -16px; }
  .ui .plain:active { color: var(--neon); }
  .ui .how { display: flex; justify-content: space-between; align-items: center; min-block-size: 44px; color: var(--ink); text-decoration: none; border-block-start: 1px solid var(--line); padding-block-start: 4px; }
  .ui .how:active { color: var(--neon); }
  @media (hover: hover) and (pointer: fine) { .ui .primary:hover { background: rgba(255, 61, 110, 0.12); } .ui .plain:hover, .ui .how:hover { color: var(--neon); } }

  #live { position: fixed; inset-inline: 0; inset-block-end: 0; padding: 0 var(--r) var(--b) var(--l); display: flex; flex-direction: column; gap: 10px; }
  #stops { display: flex; flex-wrap: wrap; gap: 6px; }
  #stops button { all: unset; cursor: pointer; min-block-size: 44px; padding-inline: 12px; display: inline-flex; align-items: center; border: 1px solid #3e3d3a; color: #a9a7a1; font-size: 14px; background: rgba(0, 0, 0, 0.7); }
  #stops button[aria-pressed="true"] { border-color: var(--neon); color: var(--ink); }
  #stops button:active { color: var(--neon); }
  #keys { -webkit-touch-callout: none; position: relative; display: flex; block-size: clamp(110px, 22vh, 170px); touch-action: none; user-select: none; -webkit-user-select: none; }
  #keys .w { flex: 1; border: 1px solid #5d5b57; border-inline-start-width: 0; background: rgba(12, 12, 14, 0.92); }
  #keys .w:first-child { border-inline-start-width: 1px; }
  #keys .b { position: absolute; inset-block-start: 0; block-size: 60%; background: #1b1b1f; border: 1px solid #5d5b57; }
  #keys .on { background: var(--neon); }
  /* While playing, the cards sit above the keyboard. */
  body.live #card { inset-block-end: calc(clamp(110px, 22vh, 170px) + 76px + var(--b)); }
  :where(button, input, a):focus-visible { outline: 1px solid var(--neon); outline-offset: 3px; }
  @media (max-width: 720px) { #steps { inset-inline-start: auto; inset-inline-end: var(--r); inset-block-start: 38%; } #steps p { max-inline-size: 13em; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<section id="intro" class="fade">
  <h1>Robot Organ<span>A pipe organ built from real physics.</span></h1>
  <p>Every pipe is made and tuned in front of you, then played in <span id="roomname">York Cathedral</span>. Best with headphones.</p>
  <div class="go"><button id="begin">Begin</button><a href="how.html">How we built it</a></div>
</section>
<div id="card" class="fade gone" aria-live="polite"><h2></h2><p></p></div>
<div id="steps" class="fade gone"><p></p></div>
<div id="progress"></div>
<button id="skip" class="ctl fade gone">Skip</button>
<button id="stopbtn" class="ctl fade gone">Stop</button>
<section class="ui fade gone" id="ui" aria-label="Menu">
  <p class="label num">Songs</p>
  <ol id="songs"></ol>
  <button id="liveopen" class="primary">Play it yourself</button>
  <p class="label num">Find a song (beta)</p>
  <form id="find"><input id="q" type="search" placeholder="Search for a song" autocomplete="off" aria-label="Search for a song (beta)"></form>
  <ol id="results"></ol>
  <a class="how" href="how.html">How we built it <span aria-hidden="true">→</span></a>
</section>
<section id="live" class="fade gone" aria-label="Play the organ">
  <div id="stops"></div>
  <div id="keys"></div>
</section>
<button id="livedone" class="ctl fade gone">Done</button>
<script type="module" src="app.js"></script>
</body>
</html>
